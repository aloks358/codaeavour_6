<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Team</title>
</head>
<body>
    <h1>Submit Team Details</h1>
    <form method="POST">
        <label for="team_name">Team Name:</label>
        <input type="text" id="team_name" name="team_name" required><br><br>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="elementary">Elementary</option>
            <option value="junior">Junior</option>
            <option value="senior">Senior</option>
        </select><br><br>

        <label for="track">Track:</label>
        <select id="track" name="track" required>
            <option value="1">Track 1</option>
            <option value="2">Track 2</option>
        </select><br><br>

        <label for="username">User Name:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="student1">Student 1:</label>
        <input type="text" id="student1" name="student1" required><br><br>

        <label for="student2">Student 2:</label>
        <input type="text" id="student2" name="student2" required><br><br>

        <label for="student3">Student 3:</label>
        <input type="text" id="student3" name="student3" required><br><br>

        <label for="leader">Select Team Leader:</label>
        <select id="leader" name="leader" required>
            <option value="student1">Student 1</option>
            <option value="student2">Student 2</option>
            <option value="student3">Student 3</option>
        </select><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
